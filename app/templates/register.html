{% extends "base.html" %}
{% block public_content %}<div class="auth-page"><div class="auth-card"><a class="brand justify-content-center" href="{{ url_for('main.index') }}"><span class="brand-mark">✦</span> Auto<span>Cloud</span></a><h2>Create account</h2><p class="muted">Start managing your cloud with clarity.</p>{% include "_auth_messages.html" %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username</label><input name="username" required minlength="3"><label>Email</label><input type="email" name="email" required><label>Password</label><input type="password" name="password" required minlength="8"><button class="btn btn-primary w-100 mt-3">Create account</button></form><p class="auth-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></div>{% endblock %}
